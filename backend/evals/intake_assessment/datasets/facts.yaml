    tags: [genai, external, planned-controls]
    description: >
      Insurance claims assistant for policyholders: customers upload photos and describe the
      damage, and an LLM drafts a claim summary for the adjuster, who makes the decision. SSO
      and role-based access are in place for adjusters, and the model vendor's contract
      prohibits training on our data. We intend to add output filtering and a red-team
      exercise before we go from pilot to production.
    expected:
      ai_system.uses_ai: true
      ai_system.gpai_model_used: true
      ai_system.model_source: third_party_api
      project.target_users: external
      project.lifecycle_stage: pilot
      use_case.domains: [credit_insurance]
      use_case.generates_synthetic_content: true
      ai_system.autonomy_level: assistive
      ai_system.human_oversight: true
      data.processes_personal_data: true
      data.data_subjects: [customers]
      use_case.affects_legal_or_significant_effects: true
      data.biometric_identification: false
      use_case.social_scoring: false
      controls.in_place: [access_controls, vendor_data_protections]
    absent: [data.retention_policy]
    inherent: high
    residual: high
    note: Output filtering and red-teaming are intentions; access controls and vendor terms are in place.

  - id: plan-oversight-aspiration
    tags: [ml, internal, planned-controls]
    description: >
      A resume-ranking model that orders applicants for recruiters by predicted fit, trained
      on past hiring outcomes. Today the ranking is applied automatically to decide who gets
      a first-round interview; we are considering adding a recruiter review step. Internal
      recruiters, in production for graduate hiring.
    expected:
      ai_system.uses_ai: true
      ai_system.fine_tuned_or_trained: true
      project.target_users: internal
      project.lifecycle_stage: production
      use_case.domains: [hr_employment]
      ai_system.autonomy_level: decides
      ai_system.human_oversight: false
      data.processes_personal_data: true
      data.data_subjects: [employees]
      data.trains_on_personal_data: true
