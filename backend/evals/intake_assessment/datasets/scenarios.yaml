# Second batch of use-case descriptions, chosen for breadth: agentic automation, retrieval
# assistants, operations and critical infrastructure, insurance, legal, education, law
# enforcement, migration, media, marketing, security operations, healthcare, trading, public
# services, children, accessibility and workforce management. Several cases are traps for a
# specific false positive (named in the note).
#
# `inherent` and `residual` are the tiers the engine derives from `expected` once everything is
# confirmed; the loader checks them, so a wrong tier here fails fast.

cases:
  # --- Agentic automation ----------------------------------------------------------------------
  - id: agent-it-ticket-remediation
    tags: [agentic, genai, internal, decides]
    description: >
      An internal IT operations agent built on Anthropic's Claude through the API. It reads new
      service-desk tickets, picks a remediation playbook (restart a service, clear a disk, reset
      a password) and runs it on our servers straight away, then posts a summary comment on the
      ticket. Nobody approves an action before it runs. Tickets contain employees' names, email
      addresses and sometimes screenshots. Engineers sign in with SSO to see the agent console,
      every action is written to an audit log, and there is a kill switch that stops the agent
      and rolls back its last change.
    expected:
      ai_system.uses_ai: true
      ai_system.gpai_model_used: true
      ai_system.model_source: third_party_api
      project.target_users: internal
      ai_system.autonomy_level: decides
      ai_system.human_oversight: false
      use_case.generates_synthetic_content: true
      use_case.domains: [other]
      use_case.affects_legal_or_significant_effects: false
      data.processes_personal_data: true
      data.data_subjects: [employees]
      data.biometric_identification: false
      use_case.emotion_recognition: false
      controls.in_place: [access_controls, incident_response]
    absent: [data.retention_policy]
    inherent: high
    residual: medium
    note: Autonomy is the driver; the kill switch and SSO are real controls but do not bring it below medium.

  - id: agent-procurement-orders
    tags: [agentic, ml, internal, decides, financial]
    description: >
      A purchasing bot for our facilities team. An in-house gradient-boosting model forecasts
      consumable stock per site and the bot places purchase orders with suppliers through their
      APIs whenever a site is predicted to run short, as long as the order is under 5,000 euros.
      Orders are placed without anyone approving them first; the finance team receives a weekly
      summary. It works with supplier catalogues and site stock counts; there is no personal
      data and no language model.
    expected:
      ai_system.uses_ai: true
      ai_system.gpai_model_used: false
      ai_system.model_source: in_house
      project.target_users: internal
      ai_system.autonomy_level: decides
      ai_system.human_oversight: false
      use_case.generates_synthetic_content: false
      use_case.interacts_directly_with_people: false
      use_case.domains: [other]
      use_case.affects_legal_or_significant_effects: false
      data.processes_personal_data: false
      data.biometric_identification: false
      controls.in_place: [none]
    absent: [data.retention_policy]
    inherent: medium
    residual: medium
    note: Financial exposure through unattended spending; no personal data, so privacy stays low.

  # --- Retrieval assistants ----------------------------------------------------------------------
  - id: rag-hr-policy-assistant
    tags: [genai, rag, internal, trap-hr-domain]
    description: >
      A chatbot for all staff that answers questions about our HR policies (leave, expenses,
      parental benefits) by retrieving passages from the policy handbook and summarising them
      with Azure OpenAI. It only reads the handbook; it has no access to employee records and
      makes no decisions about anyone. Staff sign in with company SSO, a banner says the answers
      are AI-generated, and the HR team spot-checks a sample of answers every week.
    expected:
      ai_system.uses_ai: true
      ai_system.gpai_model_used: true
      ai_system.model_source: third_party_api
      project.target_users: internal
      use_case.interacts_directly_with_people: true
      use_case.generates_synthetic_content: true
      use_case.domains: [other]
      use_case.affects_legal_or_significant_effects: false
      ai_system.autonomy_level: assistive
      ai_system.human_oversight: true
      data.biometric_identification: false
      use_case.emotion_recognition: false
      use_case.social_scoring: false
      controls.in_place: [access_controls, user_disclosure]
    absent: [data.retention_policy]
    inherent: medium
    residual: low
    note: Trap - it is about HR policy text, not decisions about workers; hr_employment would be a false positive.

  # --- Operations and critical infrastructure -------------------------------------------------
  - id: ops-predictive-maintenance
    tags: [ml, internal, no-pii]
    description: >
      Vibration and temperature readings from the pumps in our two bottling plants feed an
      XGBoost model we trained ourselves that predicts which pump is likely to fail in the next
      two weeks. Maintenance planners look at the list each morning and decide what to service.
      There is no personal data in the sensor feeds and the tool is only used by the plant
      maintenance team.
    expected:
      ai_system.uses_ai: true
      ai_system.gpai_model_used: false
      ai_system.model_source: in_house
      ai_system.fine_tuned_or_trained: true
      project.target_users: internal
      ai_system.autonomy_level: recommends
      ai_system.human_oversight: true
      use_case.generates_synthetic_content: false
      use_case.interacts_directly_with_people: false
      use_case.domains: [other]
      use_case.affects_legal_or_significant_effects: false
      data.processes_personal_data: false
      data.biometric_identification: false
    absent: [controls.in_place]
    inherent: low
    residual: low
    note: Trap - a factory is not critical infrastructure under Annex III.

  - id: ops-grid-load-shedding
    tags: [ml, internal, annex-iii, critical-infrastructure]
    description: >
      We are a regional electricity distribution operator. A forecasting model we built
      predicts substation load and, when a substation approaches its limit, the control
      software automatically sheds load on the lowest-priority feeders. Grid operators in the
      control room watch the system and can override any action. The inputs are aggregated
      feeder measurements and weather data; no customer-level data is used. It has been live
      for a year.
    expected:
      ai_system.uses_ai: true
      ai_system.gpai_model_used: false
      ai_system.model_source: in_house
      project.target_users: internal
      project.lifecycle_stage: production
      ai_system.autonomy_level: decides
      ai_system.human_oversight: true
      use_case.domains: [critical_infrastructure]
      use_case.affects_legal_or_significant_effects: false
      use_case.generates_synthetic_content: false
      data.processes_personal_data: false
      data.biometric_identification: false
    inherent: high
    residual: medium
    note: Annex III 2 safety component; the legal floor keeps residual at medium whatever the oversight.

  # --- Legal and insurance -------------------------------------------------------------------
  - id: legal-contract-clause-extraction
    tags: [genai, internal, pii, controls]
    description: >
      Our legal team uses Anthropic Claude through AWS Bedrock to pull out termination,
      liability and data-protection clauses from customer contracts and draft a one-page
      summary memo. The contracts name the customer's signatories and contact persons. Lawyers
      read the memo alongside the contract and make every call themselves. Only members of the
      legal group, enforced through role-based access, can upload contracts, and our Bedrock
      agreement states the provider does not retain or train on our prompts.
    expected:
      ai_system.uses_ai: true
      ai_system.gpai_model_used: true
      ai_system.model_source: third_party_api
      project.target_users: internal
      ai_system.autonomy_level: assistive
      ai_system.human_oversight: true
      use_case.generates_synthetic_content: true
      use_case.interacts_directly_with_people: false
      use_case.domains: [other]
      use_case.affects_legal_or_significant_effects: false
      data.processes_personal_data: true
      data.data_subjects: [customers]
      data.biometric_identification: false
      controls.in_place: [access_controls, vendor_data_protections]
    absent: [data.retention_policy]
    inherent: medium
    residual: low

  - id: ins-claims-auto-settlement
    tags: [ml, external, decides, pii, trap-credit-domain]
    description: >
      A motor-insurance claims model trained in-house on past claims. From the claim form,
      photos of the damage and the policy record it estimates the repair cost; claims it
      estimates under 2,000 euros are paid out automatically, the rest go to a claims handler.
      Customers submit claims through our app. The data includes the claimant's name, address,
      vehicle registration and the accident description. A claims handler can reopen any
      automatic settlement, and the model was validated against a year of handler decisions
      before launch.
    expected:
      ai_system.uses_ai: true
      ai_system.gpai_model_used: false
      ai_system.model_source: in_house
      ai_system.fine_tuned_or_trained: true
      project.target_users: external
      ai_system.autonomy_level: decides
      ai_system.human_oversight: true
      use_case.domains: [other]
      use_case.affects_legal_or_significant_effects: true
      use_case.generates_synthetic_content: false
      data.processes_personal_data: true
      data.data_subjects: [customers]
      data.biometric_identification: false
      data.special_category_data: []
      controls.in_place: [pre_release_evaluation]
    absent: [data.retention_policy]
    inherent: high
    residual: medium
    note: Trap - claims settlement is neither creditworthiness nor life/health pricing, so credit_insurance would be a false positive; the payout decision is still a significant effect.

  - id: ins-health-premium-pricing
    tags: [ml, external, annex-iii, special-category]
    description: >
      A model that prices private health-insurance premiums for new applicants from their
      medical questionnaire, age and postcode. It proposes a premium and an underwriter
      reviews borderline cases before an offer is sent; routine cases go out with the model's
      price. Applicants apply through brokers. The model is a gradient-boosted tree we trained
      on ten years of policy and claims data. Underwriters sign in with named accounts and
      roles.
    expected:
      ai_system.uses_ai: true
      ai_system.gpai_model_used: false
      ai_system.model_source: in_house
      ai_system.fine_tuned_or_trained: true
      project.target_users: internal
      ai_system.autonomy_level: recommends
      ai_system.human_oversight: true
      use_case.domains: [credit_insurance]
      use_case.affects_legal_or_significant_effects: true
      data.processes_personal_data: true
      data.special_category_data: [health]
      data.data_subjects: [customers]
      data.trains_on_personal_data: true
      data.biometric_identification: false
      controls.in_place: [access_controls]
    absent: [data.retention_policy]
    inherent: high
    residual: high
    note: Annex III 5(c) health insurance pricing with health data; underwriters are internal users, applicants are the data subjects; oversight alone cannot bring it down.

  # --- Education ----------------------------------------------------------------------------
  - id: edu-essay-grading
    tags: [genai, annex-iii, minors, education]
    description: >
      A secondary-school platform where teachers upload pupils' essays and GPT-4o proposes a
      grade and written feedback. Teachers review each proposed grade and comment before it
      is released to the pupil and entered in the report card. Pupils are aged 12 to 18. The
      platform is used by teachers at our partner schools and stores essays with the pupil's
      name and class.
    expected:
      ai_system.uses_ai: true
      ai_system.gpai_model_used: true
      ai_system.model_source: third_party_api
      project.target_users: external
      ai_system.autonomy_level: recommends
      ai_system.human_oversight: true
      use_case.domains: [education]
      use_case.affects_legal_or_significant_effects: true
      use_case.generates_synthetic_content: true
      data.processes_personal_data: true
      data.data_subjects: [minors]
      data.biometric_identification: false
      use_case.emotion_recognition: false
    absent: [controls.in_place]
    inherent: critical
    residual: high

  - id: edu-proctoring-stress-detection
    tags: [prohibited, education, biometric, emotion]
    description: >
      Remote exam proctoring for a university. Before the exam the candidate's face is matched
      against their student-card photo to confirm identity. During the exam the webcam feed is
      analysed to track gaze and to flag candidates whose facial expressions indicate stress
      or anxiety, which invigilators treat as a cheating signal. Candidates are adult students.
    expected:
      ai_system.uses_ai: true
      project.target_users: external
      use_case.domains: [education]
      data.biometric_identification: true
      use_case.emotion_recognition: true
      data.processes_personal_data: true
      data.special_category_data: [biometric]
      use_case.affects_legal_or_significant_effects: true
      use_case.social_scoring: false
    inherent: critical
    residual: critical
    note: Emotion recognition in education is prohibited (Art. 5(1)(f)); the identity check is Annex III 1 on its own.

  # --- Law enforcement, migration ---------------------------------------------------------------
  - id: le-station-live-face-matching
    tags: [prohibited, law-enforcement, biometric]
    description: >
      A pilot for the transport police: cameras in the main railway station stream to a face
      recognition service that matches passers-by in real time against a watch list of wanted
      persons and alerts officers on the platform. Everyone passing through the concourse is
      scanned.
    expected:
      ai_system.uses_ai: true
      project.lifecycle_stage: pilot
      use_case.domains: [law_enforcement]
      data.biometric_identification: true
      use_case.remote_biometric_id_public_spaces: true
      data.processes_personal_data: true
      data.data_subjects: [public]
      data.special_category_data: [biometric]
    inherent: critical
    residual: critical

  - id: le-interview-transcription
    tags: [ml, law-enforcement, annex-iii, special-category, trap-biometric]
    description: >
      A police force runs a self-hosted Whisper model to transcribe recorded suspect and
      witness interviews so officers can search and quote them. Officers check transcripts
      against the recording before they are used; the system does not identify speakers by
      voice. Recordings concern criminal investigations and name the people involved. Access
      is limited to the investigating team through the case-management system's permissions.
    expected:
      ai_system.uses_ai: true
      ai_system.model_source: open_weights
      ai_system.gpai_model_used: false
      project.target_users: internal
      ai_system.autonomy_level: assistive
      ai_system.human_oversight: true
      use_case.domains: [law_enforcement]
      data.processes_personal_data: true
      data.special_category_data: [criminal]
      data.biometric_identification: false
      use_case.emotion_recognition: false
      use_case.remote_biometric_id_public_spaces: false
      controls.in_place: [access_controls]
    inherent: high
    residual: medium
    note: Trap - voice is processed but nobody is identified by it, so biometric_identification is false; the domain still makes it Annex III.

  - id: mig-visa-application-ranking
    tags: [ml, annex-iii, migration, external]
    description: >
      For a national immigration authority we rank incoming short-stay visa applications by
      a risk score so that caseworkers review the highest-scoring files first. The score uses
      the applicant's travel history, sponsor details and application answers. Caseworkers
      decide every application; the score only sets the order and a flag. Applicants are
      members of the public applying from abroad.
    expected:
      ai_system.uses_ai: true
      ai_system.autonomy_level: recommends
      ai_system.human_oversight: true
      use_case.domains: [migration_border]
      use_case.affects_legal_or_significant_effects: true
      data.processes_personal_data: true
      data.data_subjects: [public]
      data.biometric_identification: false
      use_case.social_scoring: false
    absent: [controls.in_place]
    inherent: high
    residual: medium
    note: Who operates a vendor-built tool at a client authority is ambiguous (its caseworkers or our staff), so target_users is not scored; the Annex III floor keeps the residual at medium.

  # --- Media and content -------------------------------------------------------------------
  - id: media-voice-clone-adverts
    tags: [genai, internal, synthetic-media]
    description: >
      Our marketing studio uses ElevenLabs to generate voice-overs for radio and online
      adverts by cloning the voice of an actor we have under contract, with her written
      consent for this use. Producers type the script, review the audio and publish it to
      the campaigns. The tool is used by three producers in the studio.
    expected:
      ai_system.uses_ai: true
      ai_system.model_source: third_party_api
      project.target_users: internal
      ai_system.autonomy_level: assistive
      ai_system.human_oversight: true
      use_case.generates_synthetic_content: true
      use_case.interacts_directly_with_people: false
      use_case.domains: [other]
      use_case.affects_legal_or_significant_effects: false
      data.processes_personal_data: true
      data.biometric_identification: false
    inherent: medium
    residual: medium
    note: Whether a voice-synthesis model is a general-purpose model is unsettled, so gpai_model_used is not scored. The voice recording is personal data sent to a third party; it is not used to identify anyone. Generated audio must be marked (Art. 50).

  - id: media-manual-translation
    tags: [genai, internal, no-pii]
    description: >
      We translate product manuals into twelve languages with DeepL's API and a GPT-4o pass
      for terminology consistency. Professional translators review every page before
      publication. The manuals contain no personal information.
    expected:
      ai_system.uses_ai: true
      ai_system.gpai_model_used: true
      ai_system.model_source: third_party_api
      project.target_users: internal
      ai_system.autonomy_level: assistive
      ai_system.human_oversight: true
      use_case.generates_synthetic_content: true
      use_case.interacts_directly_with_people: false
      use_case.domains: [other]
      use_case.affects_legal_or_significant_effects: false
      data.processes_personal_data: false
      data.biometric_identification: false
    inherent: low
    residual: low

  # --- Marketing -----------------------------------------------------------------------------
  - id: mkt-offer-targeting
    tags: [ml, external, pii, decides]
    description: >
      A propensity model picks which promotional offer each logged-in customer sees on our
      grocery app's home screen, using their purchase history and browsing in the app. The
      choice is made automatically for every session; nobody reviews individual selections.
      We trained the model on our own loyalty-card data. No health, ethnicity or other
      sensitive attributes are used.
    expected:
      ai_system.uses_ai: true
      ai_system.gpai_model_used: false
      ai_system.model_source: in_house
      ai_system.fine_tuned_or_trained: true
      project.target_users: external
      ai_system.autonomy_level: decides
      ai_system.human_oversight: false
      use_case.generates_synthetic_content: false
      use_case.interacts_directly_with_people: false
      use_case.domains: [other]
      use_case.affects_legal_or_significant_effects: false
      data.processes_personal_data: true
      data.data_subjects: [customers]
      data.trains_on_personal_data: true
      data.special_category_data: []
      data.biometric_identification: false
      use_case.manipulative_or_subliminal: false
    absent: [controls.in_place]
    inherent: high
    residual: high

  - id: mkt-checkout-assistant-persuasion-trap
    tags: [genai, public, trap-manipulative]
    description: >
      A checkout assistant on our public web shop, built on GPT-4o, that answers shoppers'
      questions, suggests bundles and writes persuasive product blurbs. When stock is low it
      says so, always truthfully. Shoppers see a label that the assistant is automated. It
      sees the shopper's cart and shipping address. There is no login requirement.
    expected:
      ai_system.uses_ai: true
      ai_system.gpai_model_used: true
      ai_system.model_source: third_party_api
      project.target_users: public
      use_case.interacts_directly_with_people: true
      use_case.generates_synthetic_content: true
      use_case.domains: [other]
      use_case.affects_legal_or_significant_effects: false
      use_case.manipulative_or_subliminal: false
      data.processes_personal_data: true
      data.data_subjects: [public]
      data.biometric_identification: false
      use_case.emotion_recognition: false
      controls.in_place: [user_disclosure]
    inherent: high
    residual: high
    note: Trap - persuasive copy is ordinary marketing, not a manipulative or subliminal technique.

  # --- Security operations ---------------------------------------------------------------------
  - id: sec-network-intrusion-blocking
    tags: [ml, internal, security, decides]
    description: >
      An anomaly-detection model we built scores network flows from our offices and data
      centre and automatically blocks source addresses whose score crosses a threshold.
      Analysts in the SOC see every block in their console and can lift it. The flow records
      carry internal IP addresses and the usernames of staff on the VPN. The console is behind
      the SOC's SSO group.
    expected:
      ai_system.uses_ai: true
      ai_system.gpai_model_used: false
      ai_system.model_source: in_house
      project.target_users: internal
      ai_system.autonomy_level: decides
      ai_system.human_oversight: true
      use_case.generates_synthetic_content: false
      use_case.domains: [other]
      use_case.affects_legal_or_significant_effects: false
      data.processes_personal_data: true
      data.data_subjects: [employees]
      data.biometric_identification: false
      controls.in_place: [access_controls]
    inherent: medium
    residual: low

  # --- Healthcare ----------------------------------------------------------------------------
  - id: health-ct-nodule-flagging
    tags: [ml, annex-i, medical-device, special-category]
    description: >
      A convolutional network that marks suspected lung nodules on chest CT scans for the
      radiologist, who reads every scan and writes the report. It is CE-marked as a class IIa
      medical device. It runs inside the hospital's imaging network for the radiology
      department, processes patient scans with the patient identifier, and was clinically
      validated on a multi-site dataset before deployment.
    expected:
      ai_system.uses_ai: true
      ai_system.gpai_model_used: false
