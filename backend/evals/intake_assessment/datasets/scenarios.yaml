      data.special_category_data: [health]
      data.biometric_identification: false
      controls.in_place: [pre_release_evaluation]
    inherent: high
    residual: high

  - id: health-step-goal-app-trap
    tags: [ml, public, pii, trap-medical]
    description: >
      A consumer walking app for adults. A small on-device model looks at the last four
      weeks of step counts and suggests a weekly step goal, which the user can change. Users
      create an account with their email address. It gives no medical advice and is not a
      medical device.
    expected:
      ai_system.uses_ai: true
      ai_system.gpai_model_used: false
      project.target_users: public
      use_case.domains: [other]
      use_case.affects_legal_or_significant_effects: false
