  # --- Public services ---------------------------------------------------------------------
  - id: pub-benefits-prechecker
    tags: [genai, public, annex-iii, essential-services, controls]
    description: >
      A city council chatbot built on GPT-4o that helps residents find out whether they may
      qualify for housing benefit and pre-fills the application from their answers about
      household size, income and rent. A caseworker decides every application; the chatbot
      never grants or refuses anything. It is open to anyone on the council website, says it
      is an automated assistant, runs input and output content filters, and strips names and
      addresses before anything is sent to the model. A caseworker team reviews flagged
      conversations.
    expected:
      ai_system.uses_ai: true
      ai_system.gpai_model_used: true
      ai_system.model_source: third_party_api
      project.target_users: public
      use_case.interacts_directly_with_people: true
      use_case.generates_synthetic_content: true
      use_case.domains: [essential_services]
      use_case.affects_legal_or_significant_effects: true
      ai_system.autonomy_level: recommends
      ai_system.human_oversight: true
      data.processes_personal_data: true
      data.data_subjects: [public]
      data.biometric_identification: false
      use_case.social_scoring: false
      controls.in_place: [user_disclosure, guardrails, pii_minimisation]
    inherent: critical
    residual: high
    note: Public, generative, personal financial data and an Annex III 5(a) area; strong controls still leave it high.

  # --- Children -----------------------------------------------------------------------------
  - id: kids-companion-toy
    tags: [genai, public, minors, no-controls]
    description: >
      A plush toy with a microphone that chats with children aged four to eight. Speech is
      sent to a cloud speech-to-text service and the reply is written by a third-party large
      language model and spoken back. The toy is sold to the public. Recordings are kept to
      improve the product. We have not yet built any content filtering and nobody reviews the
      conversations.
    expected:
      ai_system.uses_ai: true
      ai_system.gpai_model_used: true
      ai_system.model_source: third_party_api
      project.target_users: public
      use_case.interacts_directly_with_people: true
      use_case.generates_synthetic_content: true
      ai_system.human_oversight: false
      use_case.domains: [other]
      data.processes_personal_data: true
      data.data_subjects: [minors]
      data.trains_on_personal_data: true
      data.biometric_identification: false
      use_case.emotion_recognition: false
      controls.in_place: [none]
    inherent: high
    residual: high

  # --- Accessibility -----------------------------------------------------------------------
  - id: access-live-captions-trap
    tags: [ml, internal, pii, trap-biometric]
    description: >
      Live captions in our video meetings for colleagues with hearing loss, using Azure
      Speech-to-Text. The audio of everyone in the meeting is transcribed; the service does
      not identify who is speaking and we do not enrol voices. Captions are not stored after
      the meeting. Available to all employees inside the company tenant.
    expected:
      ai_system.uses_ai: true
      ai_system.model_source: third_party_api
      project.target_users: internal
      ai_system.autonomy_level: assistive
      use_case.interacts_directly_with_people: false
      use_case.generates_synthetic_content: false
      use_case.domains: [other]
      use_case.affects_legal_or_significant_effects: false
      data.processes_personal_data: true
      data.data_subjects: [employees]
      data.biometric_identification: false
      use_case.emotion_recognition: false
    inherent: low
    residual: low
    note: Trap - voice audio without speaker identification is not biometric identification.

  # --- Workforce management ---------------------------------------------------------------
  - id: hr-productivity-scoring
    tags: [ml, internal, annex-iii, hr]
    description: >
      A model that gives each employee in the sales organisation a weekly productivity score
      from their email volume, calendar occupancy and CRM activity. Managers see the scores
      in a dashboard and use them as one input to quarterly performance reviews; managers make
      the review decisions. The model was built by our people-analytics team.
    expected:
      ai_system.uses_ai: true
      ai_system.gpai_model_used: false
      ai_system.model_source: in_house
      project.target_users: internal
      ai_system.autonomy_level: recommends
      ai_system.human_oversight: true
      use_case.domains: [hr_employment]
      use_case.affects_legal_or_significant_effects: true
      use_case.generates_synthetic_content: false
      data.processes_personal_data: true
      data.data_subjects: [employees]
      data.biometric_identification: false
      use_case.emotion_recognition: false
      use_case.social_scoring: false
    absent: [controls.in_place]
    inherent: high
    residual: medium

  - id: hr-shift-rostering
    tags: [ml, internal, annex-iii, hr, decides]
    description: >
      A rostering optimiser for our warehouses: a demand forecast we trained plus a solver
      assigns shifts to each worker for the coming week. The roster goes live automatically
      on Thursday unless the site HR manager edits it first, and workers can swap shifts in
      the app. It uses workers' names, contracts, availability and past shifts.
    expected:
      ai_system.uses_ai: true
      ai_system.gpai_model_used: false
      ai_system.model_source: in_house
      project.target_users: internal
      ai_system.autonomy_level: decides
      ai_system.human_oversight: true
      use_case.domains: [hr_employment]
      use_case.affects_legal_or_significant_effects: true
      use_case.generates_synthetic_content: false
      use_case.interacts_directly_with_people: false
      data.processes_personal_data: true
      data.data_subjects: [employees]
      data.trains_on_personal_data: true
      data.biometric_identification: false
      use_case.emotion_recognition: false
    absent: [controls.in_place]
    inherent: high
    residual: high
    note: Task allocation to workers is Annex III 4(b); the forecast is trained on workers' past shifts; swapping shifts in an app is not conversing with the system.

  # --- No AI -----------------------------------------------------------------------------
  - id: noai-invoice-threshold-script
    tags: [noai, internal]
    description: >
      A nightly Python script that reads the day's supplier invoices from the ERP, flags any
      over 10,000 euros or from a supplier not on the approved list, and emails the list to
      the finance controller for manual approval. It is a set of fixed rules; there is no
      model of any kind. Invoices carry supplier company details only.
    expected:
      ai_system.uses_ai: false
      project.target_users: internal
      use_case.generates_synthetic_content: false
      use_case.interacts_directly_with_people: false
      data.processes_personal_data: false
      data.biometric_identification: false
    inherent: low
    residual: low
