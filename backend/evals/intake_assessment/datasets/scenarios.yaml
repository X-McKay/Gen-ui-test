  - id: fin-algorithmic-trading
    tags: [ml, internal, decides, financial, no-pii]
    description: >
      Our market-making desk runs a reinforcement-learning strategy that places and cancels
      orders on European equity venues within pre-set position and loss limits. Trades are
      executed automatically in milliseconds; the risk desk watches the book and has a kill
      switch that flattens positions. Inputs are market data only; there is no personal data
      and no language model.
    expected:
      ai_system.uses_ai: true
      ai_system.gpai_model_used: false
      ai_system.model_source: in_house
      project.target_users: internal
      ai_system.autonomy_level: decides
