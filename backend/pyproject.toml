[project]
name = "intake-backend"
version = "0.1.0"
description = "AI Governance Intake backend: FastAPI, AG-UI, Google ADK, governance rules engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    "pydantic-settings>=2.16",
    "sqlmodel>=0.0.48",
    "google-adk>=2.13.0",
    "ag-ui-adk>=0.12.0",
    "ag-ui-protocol>=1.0.0",
    "litellm>=1.106.0",
    # Not imported by the app: LiteLLM imports it lazily inside its chat-completion path, so
    # every live model call fails with "No module named 'mcp'" without it (the mock model never
    # touches LiteLLM, so only the live e2e suite notices).
    "mcp>=2.3.0",
    "gitpython>=3.2.1",
    "jinja2>=3.1",
    "weasyprint>=70.0",
    "httpx>=0.28",
    "python-json-logger>=3.2",
    "sse-starlette>=2.2",
    # Not imported by the app: LiteLLM needs it at runtime when INFERENCE_PROVIDER=bedrock.
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.0",
    "ruff>=0.17",
    "mypy>=1.14",
    "respx>=0.22",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF012", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["ag_ui_adk.*", "google.adk.*", "google.genai.*", "litellm.*", "git.*", "weasyprint.*", "sse_starlette.*", "boto3.*", "pythonjsonlogger.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
