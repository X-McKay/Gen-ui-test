name: lane-reviewer
description: >
  Review one risk lane of the repository by tracing data flows from the lane's sources to
  its sinks, and report grounded findings with a failure scenario and a proposed test.

instructions: instructions/system.md

model_settings:
  temperature: 0.1
  max_tokens: 4000
  enable_thinking: false

retries: 1
tool_timeout: 20

metadata:
  contract_version: 1
  owner: platform
  version: 1.0.0
  execution_class: ephemeral
  governance_tier: low
  risk_assessment: docs/risk-assessments/risk-review.yaml
  data_classification: internal
  model_policy: balanced-v1
  enabled_skills:
    - evidence-standards
    - model-output-to-state
    - logging-and-redaction
    - repository-analysis
    - api-and-persistence
    - export-rendering
    - frontend-trust
  enabled_toolsets:
    - repo-read
    - report-findings
  budgets:
    max_requests: 45
    max_input_tokens: 1500000   # cumulative over the run; context grows to ~40k per request
    max_output_tokens: 30000
    max_tool_calls: 40
    max_cost_usd: 0
