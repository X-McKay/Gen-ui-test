name: fact-finder
description: >
  Establish the governance facts about a repository for one fact lane (purpose and users,
  AI usage, data and privacy, third-party services, controls in code), each grounded in
  lines of the repository's documentation, configuration or code.

instructions: instructions/system.md

model_settings:
  temperature: 0.1
  max_tokens: 6000
  enable_thinking: false

retries: 1
tool_timeout: 20

metadata:
  contract_version: 1
  owner: platform
  version: 1.0.0
  execution_class: ephemeral
  governance_tier: low
  risk_assessment: docs/risk-assessments/risk-review.yaml
  data_classification: internal
  model_policy: balanced-v1
  enabled_skills:
    - fact-standards
    - purpose-and-users
    - ai-usage
    - data-and-privacy
    - third-party-services
    - controls-in-code
  enabled_toolsets:
    - repo-read
    - record-facts
  budgets:
    max_requests: 40
    max_input_tokens: 1200000
    max_output_tokens: 24000
    max_tool_calls: 36
    max_cost_usd: 0
