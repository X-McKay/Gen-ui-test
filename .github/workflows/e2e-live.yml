name: E2E (live model)

# The mock suite runs on every pull request (ci.yml). This workflow drives the same
# Playwright specs against the real inference endpoint once a night and on demand.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC, daily
  workflow_dispatch:

concurrency:
  group: e2e-live
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  e2e-live:
    name: Playwright (live model, chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_LIVE: "1"
      MOCK_MODEL: "0"
      INFERENCE_PROVIDER: openai_compatible
      OPENAI_BASE_URL: https://llm.almckay.io/v1
      OPENAI_API_KEY: ${{ secrets.LLM_ALMCKAY_API_KEY }}
      MODEL_ID: openai/Qwen3.6-35B-A3B-NVFP4
      BACKEND_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install WeasyPrint system libraries and git
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi-dev \
            libjpeg62-turbo libopenjp2-7 libcairo2 fonts-dejavu-core

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install toolchains
        run: |
          uv python install ${{ env.PYTHON_VERSION }}
          (cd backend && uv sync --frozen --extra dev)
          (cd frontend && pnpm install --frozen-lockfile)

      - name: Install Playwright (chromium only)
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright tests against the live endpoint
        working-directory: frontend
        run: pnpm exec playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-live
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 30
