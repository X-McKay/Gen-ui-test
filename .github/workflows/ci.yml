name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  # Nothing in CI talks to a model endpoint.
  MOCK_MODEL: "1"

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install WeasyPrint system libraries and git
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi-dev \
            libjpeg62-turbo libopenjp2-7 libcairo2 fonts-dejavu-core

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python and dependencies
        run: |
          uv python install ${{ env.PYTHON_VERSION }}
          uv sync --frozen --extra dev

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: mypy (strict)
        run: uv run mypy app

      - name: pytest with the governance 100 % gate
        run: >
          uv run pytest
          --cov=app/governance --cov-report=term-missing --cov-report=xml --cov-fail-under=100

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  schema:
    name: Schema freshness (make check-schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install toolchains
        run: |
          uv python install ${{ env.PYTHON_VERSION }}
          (cd backend && uv sync --frozen --extra dev)
          (cd frontend && pnpm install --frozen-lockfile)

      - name: Schema and generated types are committed and fresh
        run: make check-schema

  frontend:
    name: Frontend (eslint, tsc, vitest, next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm lint

      - name: prettier --check
        run: pnpm format:check

      - name: tsc --noEmit
        run: pnpm typecheck

      - name: vitest
        run: pnpm test --passWithNoTests

      - name: next build
        env:
          BACKEND_URL: http://127.0.0.1:8000
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

  e2e-mock:
    name: Playwright (mock model, chromium + firefox + webkit)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install WeasyPrint system libraries and git
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi-dev \
            libjpeg62-turbo libopenjp2-7 libcairo2 fonts-dejavu-core

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install toolchains
        run: |
          uv python install ${{ env.PYTHON_VERSION }}
          (cd backend && uv sync --frozen --extra dev)
          (cd frontend && pnpm install --frozen-lockfile)

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # playwright.config.ts starts both servers (webServer) with MOCK_MODEL=1 from the env.
      - name: Playwright tests
        working-directory: frontend
        env:
          CI: "true"
          MOCK_MODEL: "1"
          BACKEND_URL: http://127.0.0.1:8000
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mock
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-mock
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
